name: 每日更新并发布网站

on:
  schedule:
    # GitHub 使用 UTC：02:17 对应北京时间 10:17，并避开 arXiv 冬令时公告尚未完成的窗口。
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "site/data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nuclear-frontier-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 拉取每日论文、新闻与通知
        if: github.event_name != 'push'
        run: python scripts/update_content.py --days 14 --strict

      - name: 逐月扩展 2001 年以来的历史论文库
        if: github.event_name != 'push'
        run: python scripts/backfill_history.py --next 6 --max-workers 4

      - name: 构建站点数据
        run: python scripts/build_site.py

      - name: 运行数据与代码检查
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js

      - name: 保存当日数据快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if ! git diff --cached --quiet; then
            git commit -m "data: 每日更新 $(date -u +%F)"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              python scripts/build_site.py
              git add site/data
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
