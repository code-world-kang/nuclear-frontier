name: 每日更新并发布网站
run-name: ${{ inputs.translation_commit && format('发布翻译 {0}', inputs.translation_commit) || github.event.head_commit.message || '每日更新并发布网站' }}

on:
  schedule:
    # GitHub 使用 UTC：前一日 22:00 对应北京时间当日 06:00。
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 只构建发布已有数据，不重复采集或发布公众号
        type: boolean
        default: false
      translation_commit:
        description: 翻译提交编号，用于关联发布记录
        type: string
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "site/data/**"
      - "site/wechat-digest/**"
      - "wechat-official-account/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nuclear-frontier-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 拉取每日论文、新闻与通知
        if: github.event_name != 'push' && inputs.deploy_only != true
        run: python scripts/update_content.py --days 14 --strict

      - name: 逐月扩展 2001 年以来的历史论文库
        if: github.event_name != 'push' && inputs.deploy_only != true
        run: python scripts/backfill_history.py --next 6 --max-workers 4

      - name: 备份已配置国内主站的公开个人快照
        if: github.event_name != 'push' && inputs.deploy_only != true
        continue-on-error: true
        env:
          PERSONAL_STATE_URL: ${{ vars.PERSONAL_STATE_URL }}
        run: python scripts/backup_cloud_personal.py

      # 旧 Qwen CPU 翻译已停用，不再阻塞每日采集和发布。
      # Sol 在可信机器的独立 CLI worker 中运行；不向公开 CI 上传订阅凭据。

      - name: 构建站点数据
        run: python scripts/build_site.py

      - name: 运行数据与代码检查
        run: |
          npm ci --ignore-scripts
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --test tests/*.test.mjs

      - name: 保存当日数据快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data site/wechat-digest wechat-official-account
          if ! git diff --cached --quiet; then
            git commit -m "data: 每日更新 $(date -u +%F)"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              python scripts/build_site.py
              git add data/papers.json data/featured.json data/status.json data/translation-queue.json site/data site/wechat-digest wechat-official-account
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: 自动发布公众号科研简报
        if: github.event_name != 'push' && inputs.deploy_only != true
        env:
          WECHAT_OFFICIAL_PUBLISH_ENABLED: ${{ secrets.WECHAT_OFFICIAL_PUBLISH_ENABLED }}
          WECHAT_OFFICIAL_APP_ID: ${{ secrets.WECHAT_OFFICIAL_APP_ID }}
          WECHAT_OFFICIAL_APP_SECRET: ${{ secrets.WECHAT_OFFICIAL_APP_SECRET }}
          WECHAT_OFFICIAL_AUTHOR: ${{ vars.WECHAT_OFFICIAL_AUTHOR }}
        run: |
          if [ "$WECHAT_OFFICIAL_PUBLISH_ENABLED" != "true" ]; then
            echo "公众号自动发布尚未启用，本次仅生成简报。"
            exit 0
          fi
          if [ -z "$WECHAT_OFFICIAL_APP_ID" ] || [ -z "$WECHAT_OFFICIAL_APP_SECRET" ]; then
            echo "已启用公众号发布，但 GitHub Secrets 中缺少公众号凭据。" >&2
            exit 1
          fi
          python scripts/publish_wechat_official.py --publish

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
