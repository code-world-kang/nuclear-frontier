name: GitHub Issue 个人数据同步

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: nuclear-frontier-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[个人数据同步]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 验证 Issue 并写入公开数据
        run: >-
          python scripts/sync_github_issue.py
          --event "$GITHUB_EVENT_PATH"
          --repository-owner "${{ github.repository_owner }}"

      - name: 构建站点数据
        run: python scripts/build_site.py

      - name: 运行检查
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js

      - name: 保存个人数据快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/personal/state.json site/data/personal-state.json site/data/public-favorites.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 同步 GitHub Issue 个人数据"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 关闭已处理的 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue close "$ISSUE_URL" --comment "已同步到网站并完成 GitHub Pages 发布。稍后刷新网站即可看到。"
