<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf7df">
  <title>小康康的物理世界</title>
  <style>
    :root { color-scheme: light; --ink:#385744; --muted:#74827a; --green:#6ca56d; --line:#d9e7d1; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(155deg,#f3f8e8 0%,#fff8eb 52%,#edf7ef 100%); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(720px,100%); margin:0 auto; padding:24px 18px calc(34px + env(safe-area-inset-bottom)); }
    .hero { padding:28px 22px; border:1px solid rgba(122,166,111,.25); border-radius:26px; background:rgba(255,255,250,.82); box-shadow:0 16px 45px rgba(75,111,78,.08); text-align:center; }
    .sprout { display:inline-grid; place-items:center; width:52px; height:52px; border-radius:18px; background:#e6f3d8; font-size:28px; }
    h1 { margin:13px 0 0; font-size:clamp(25px,7vw,34px); line-height:1.35; letter-spacing:.02em; }
    .hero p { margin:10px auto 0; max-width:520px; color:var(--muted); font-size:15px; line-height:1.8; }
    .fresh { display:inline-flex; align-items:center; gap:7px; margin-top:15px; padding:7px 12px; border-radius:999px; background:#edf6e7; color:#5f8e61; font-size:13px; font-weight:700; }
    .fresh::before { content:""; width:8px; height:8px; border-radius:50%; background:#76b476; box-shadow:0 0 0 5px rgba(118,180,118,.12); }
    .section-title { margin:25px 4px 12px; color:#607366; font-size:14px; font-weight:800; letter-spacing:.12em; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .card { display:flex; min-height:132px; padding:18px; border:1px solid var(--line); border-radius:20px; background:rgba(255,255,252,.9); color:inherit; text-decoration:none; box-shadow:0 8px 24px rgba(65,96,69,.06); flex-direction:column; transition:transform .16s ease,border-color .16s ease; }
    .card:active { transform:scale(.98); border-color:#a9cba0; }
    .icon { font-size:25px; }
    .card strong { margin-top:10px; font-size:18px; }
    .card span:last-child { margin-top:5px; color:var(--muted); font-size:13px; line-height:1.55; }
    .wide { grid-column:1/-1; min-height:auto; flex-direction:row; align-items:center; gap:14px; }
    .wide strong { margin-top:0; }
    .wide .text { display:flex; flex-direction:column; }
    footer { margin-top:18px; padding:17px; color:#88958c; font-size:12px; line-height:1.75; text-align:center; }
    footer a { color:#5d8d65; font-weight:700; text-decoration:none; }
    @media (max-width:430px) { main{padding:14px 12px 28px}.hero{padding:23px 16px;border-radius:22px}.grid{gap:9px}.card{min-height:122px;padding:15px;border-radius:17px}.card strong{font-size:16px}.wide{min-height:auto} }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <span class="sprout" aria-hidden="true">🌱</span>
      <h1>小康康的物理世界</h1>
      <p>核物理论文、物理新闻、会议、基金与束流申请的每日入口。网站每日自动更新，公众号无需每天发布文章。</p>
      <span class="fresh">每日自动更新</span>
    </section>

    <p class="section-title">今日科研</p>
    <nav class="grid" aria-label="科研网站入口">
      <a class="card" href="../#papers">
        <span class="icon" aria-hidden="true">📖</span>
        <strong>最新论文</strong>
        <span>中文优先的题目、完整摘要与 Cite</span>
      </a>
      <a class="card" href="../#featured">
        <span class="icon" aria-hidden="true">🌟</span>
        <strong>重点论文</strong>
        <span>高影响期刊与重要核物理进展</span>
      </a>
      <a class="card" href="../#news">
        <span class="icon" aria-hidden="true">🌱</span>
        <strong>物理新闻</strong>
        <span>官方来源的物理与核科学新闻</span>
      </a>
      <a class="card" href="../#notices">
        <span class="icon" aria-hidden="true">📣</span>
        <strong>科研通知</strong>
        <span>涉核会议、基金指南与束流申请</span>
      </a>
      <a class="card wide" href="../#favorites-papers">
        <span class="icon" aria-hidden="true">🌼</span>
        <span class="text"><strong>我的科研</strong><span>收藏、关键词、笔记、翻译与参考资料</span></span>
      </a>
    </nav>

    <footer>
      内容来自公开学术元数据与官方通知，请以原始页面为准。<br>
      <a href="../#home">进入完整网站 ↗</a>
    </footer>
  </main>
</body>
</html>
